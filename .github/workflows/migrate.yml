name: Database Migrations V2

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f "pyproject.toml" ]; then
            pip install poetry
            poetry config virtualenvs.create false
            poetry install --no-root

          elif [ -f "Pipfile" ]; then
            pip install pipenv
            pipenv install --system

          elif ls *requirements*.txt 1> /dev/null 2>&1; then
            cat *requirements*.txt | xargs pip install

          else
            echo "Brute forcing core dependencies..."
            pip install fastapi alembic sqlalchemy pgvector asyncpg pydantic-settings passlib bcrypt python-jose
          fi

      - name: Check Migration State
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "=== Alembic current ==="
          alembic current

          echo "=== Alembic heads ==="
          alembic heads

      - name: Run Alembic Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "=== Running migrations ==="
          alembic upgrade head

          echo "=== Migration state after upgrade ==="
          alembic current
