[project]
name = "naijagov-api"
version = "0.1.0"
description = "Backend for NaijaGov: workflow rules, plan generation, and profile storage."
requires-python = ">=3.13"
dependencies = [
    # Web
    "fastapi[standard]>=0.141.1",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
    # Validation and config
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "email-validator>=2.3.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.44",
    "asyncpg>=0.30.0",
    "alembic>=1.16.5",
    # Auth — argon2id password hashing, HS256 session JWTs
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.10.1",
    # Outbound HTTP and monitoring
    "httpx>=0.28.1",
    "sentry-sdk>=2.70.0",
    # Retrieval — the `vector` column type for SQLAlchemy, and the embedding client.
    # `openai` is imported by src/documents/embeddings.py and nowhere else.
    "pgvector>=0.5.0",
    "openai>=3.19.2",
    # Ingestion only, never imported by the API: HTML and PDF extraction for scripts/,
    # plus the parser for the source manifest and the tuning fixtures.
    "beautifulsoup4>=4.15.0",
    "pypdf>=6.19.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
