[project]
name = "naijagov-api"
version = "0.1.0"
description = "Backend for NaijaGov: workflow rules, plan generation, and profile storage."
requires-python = ">=3.13"
dependencies = [
    # Web
    "fastapi[standard]>=0.141.1",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
    # Validation and config
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "email-validator>=2.3.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.44",
    "asyncpg>=0.30.0",
    "alembic>=1.16.5",
    # Auth — argon2id password hashing (column producer lands in B3)
    "argon2-cffi>=25.1.0",
    # Outbound HTTP and monitoring
    "httpx>=0.28.1",
    "sentry-sdk>=2.70.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
